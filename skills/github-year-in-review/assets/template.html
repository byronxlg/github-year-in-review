<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>GitHub year in review</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bricolage";
        src: url("assets/fonts/BricolageGrotesque.ttf") format("truetype");
        font-weight: 200 800;
        font-stretch: 75% 100%;
      }
      @font-face {
        font-family: "JBMono";
        src: url("assets/fonts/JetBrainsMono.ttf") format("truetype");
        font-weight: 100 800;
      }
      :root {
        --ground: #14120f;
        --ink: #f3eee4;
        --muted: #a39b8e;
        --rule: #2a2622;
        --signal: #ff5b24;
        --h1: #6a3a22;
        --h2: #a3431f;
        --h3: #d9501f;
        --h4: #ff5b24;
        --add: #8fd694;
        --del: #f2777a;
        --addbg: rgba(143, 214, 148, 0.11);
        --delbg: rgba(242, 119, 122, 0.11);
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font-family: "JBMono", monospace;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      /* a transition moves this wrapper, so a scene's own fades stay its own */
      .tw {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
      .cuts #rail {
        z-index: 4000;
      }
      .inner {
        position: absolute;
        inset: 0 0 150px 0;
        padding: 96px 84px 0 84px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      /* terminal prompt typed at the top of every beat */
      .term,
      .label {
        flex: none;
      }
      .term {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 44px;
        font-size: 28px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        margin-bottom: 14px;
      }
      .term .ps {
        color: var(--add);
        font-weight: 700;
      }
      /* the typed command is ink on the ground (16:1); the prompt is --add (10.9:1) */
      .term .cmd {
        color: var(--ink);
        font-weight: 500;
      }
      .term .cur {
        display: block;
        width: 0.58em;
        height: 1.15em;
        margin-left: -10px;
        background: var(--ink);
      }
      .chapter .term {
        font-size: 40px;
        height: 60px;
        gap: 22px;
        margin-bottom: 30px;
      }
      .label {
        display: flex;
        gap: 28px;
        font-size: 30px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 500;
      }
      .stack {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
      }
      .big {
        font-family: "Bricolage", sans-serif;
        font-weight: 800;
        font-stretch: 75%;
        line-height: 0.86;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .signal {
        color: var(--signal);
      }
      .name,
      .title,
      .unit,
      .arch,
      .handle,
      .kicker {
        font-family: "Bricolage", sans-serif;
        font-stretch: 75%;
      }
      .name {
        font-size: 92px;
        font-weight: 700;
        line-height: 1;
      }
      .title {
        font-size: 76px;
        font-weight: 700;
        line-height: 1.02;
        max-width: 900px;
        margin-bottom: 26px;
      }
      .unit {
        font-size: 74px;
        font-weight: 600;
        line-height: 1.05;
      }
      .sub,
      .caption,
      .note {
        font-size: 40px;
        line-height: 1.35;
        color: var(--ink);
        max-width: 900px;
      }
      .sub {
        color: var(--muted);
        margin-top: 10px;
      }
      .sub.ink {
        color: var(--ink);
      }
      /* diff blocks: plus lines are what you added to the world */
      .hunk {
        margin-top: 34px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 912px;
      }
      .dl {
        font-size: 36px;
        line-height: 1.5;
        padding: 6px 20px;
        border-radius: 4px;
        display: flex;
        gap: 18px;
        align-items: baseline;
      }
      .dl .sg {
        width: 20px;
        flex: none;
        font-weight: 700;
      }
      .dl.add { background: var(--addbg); }
      .dl.add .sg { color: var(--add); }
      .dl.del { background: var(--delbg); }
      .dl.del .sg { color: var(--del); }
      .dl.hdr { color: #8fb8e0; padding-left: 20px; }
      .dl.ctx { color: var(--ink); }
      .rows .dl b {
        font-family: "Bricolage", sans-serif;
        font-stretch: 75%;
        font-size: 46px;
        font-weight: 700;
        color: var(--ink);
      }
      .rows .dl b.tag { color: var(--signal); }
      .rows .dl span { color: var(--ink); font-size: 34px; }
      .rows .dl em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 28px; }
      .plus { font-style: normal; color: var(--add); margin-right: 18px; font-family: "JBMono", monospace; font-weight: 700; }
      .agents .unit { font-size: 60px; }
      .agents .sub, .agents .note { font-size: 38px; }
      /* the biggest change */
      .ref { font-size: 32px; color: var(--signal); }
      .ref span { color: var(--muted); margin-left: 14px; }
      .diff .title { font-size: 64px; margin-bottom: 8px; }
      .dnum { display: flex; align-items: baseline; gap: 36px; }
      .dnum .add { color: var(--add); font-size: 230px; }
      .dnum .del { color: var(--del); font-size: 110px; }
      .dstat { font-size: 30px; letter-spacing: 0.02em; font-weight: 700; }
      .dstat .add { color: var(--add); }
      .dstat .del { color: var(--del); }
      .caption {
        margin-top: 30px;
      }
      .note {
        margin-top: 20px;
        padding-left: 24px;
        border-left: 6px solid var(--signal);
      }
      /* the year grid: one row per month, one cell per day */
      .grid {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .mrow {
        display: flex;
        align-items: center;
        gap: 16px;
        position: relative;
      }
      .ml {
        width: 70px;
        font-size: 28px;
        color: var(--muted);
        text-transform: uppercase;
      }
      .mrow.peak .ml {
        color: var(--signal);
        font-weight: 700;
      }
      .cells {
        display: flex;
        gap: 3.5px;
      }
      .c {
        display: block;
        width: 23px;
        height: 38px;
        border-radius: 3px;
        background: var(--rule);
      }
      .mini {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 56px;
      }
      .mini .ml {
        display: none;
      }
      .mini .cells {
        gap: 4px;
      }
      .mini .c {
        width: 25px;
        height: 22px;
        border-radius: 3px;
      }
      .c.x {
        background: transparent;
      }
      .c.lf {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--rule);
      }
      .c.l1 { background: var(--h1); }
      .c.l2 { background: var(--h2); }
      .c.l3 { background: var(--h3); }
      .c.l4 { background: var(--h4); }
      .hl {
        position: absolute;
        left: 76px;
        right: -10px;
        top: -5px;
        bottom: -5px;
        border: 3px solid var(--ink);
        border-radius: 6px;
      }
      /* streak facts */
      .facts {
        display: flex;
        gap: 60px;
        margin-top: 40px;
        border-top: 2px solid var(--rule);
        padding-top: 34px;
      }
      .fact b {
        display: block;
        font-family: "Bricolage", sans-serif;
        font-stretch: 75%;
        font-size: 96px;
        font-weight: 800;
        line-height: 1;
      }
      .fact span {
        font-size: 30px;
        color: var(--muted);
      }
      /* clock */
      .hours {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 380px;
        margin-top: 50px;
      }
      .hb {
        flex: 1;
        height: 100%;
        display: flex;
        align-items: flex-end;
      }
      .hb .bar {
        display: block;
        width: 100%;
        background: #5a5047;
        border-radius: 4px 4px 0 0;
        transform-origin: 50% 100%;
      }
      .hb.peak .bar {
        background: var(--signal);
      }
      .ticks {
        position: relative;
        height: 40px;
        border-top: 2px solid var(--rule);
        font-size: 28px;
        color: var(--muted);
      }
      .ticks span {
        position: absolute;
        top: 8px;
      }
      /* work rows */
      .work {
        display: flex;
        flex-direction: column;
        gap: 30px;
        margin-top: 12px;
      }
      .wl {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 12px;
      }
      .wl b {
        font-family: "Bricolage", sans-serif;
        font-stretch: 75%;
        font-size: 54px;
        font-weight: 700;
      }
      .wl span {
        font-size: 30px;
        color: var(--ink);
      }
      .track {
        height: 22px;
        background: var(--rule);
        border-radius: 4px;
        overflow: hidden;
      }
      .track .bar {
        display: block;
        height: 100%;
        border-radius: 4px;
        transform-origin: 0 50%;
      }
      .lang {
        margin-top: 10px;
        font-size: 28px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .lang i {
        display: block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
      }
      .quote {
        margin-top: 30px;
        font-size: 38px;
        line-height: 1.45;
        max-width: 900px;
      }
      .quote span {
        color: var(--signal);
      }
      /* started list */
      .list {
        display: flex;
        flex-direction: column;
        gap: 26px;
        margin-top: 36px;
        border-top: 2px solid var(--rule);
        padding-top: 30px;
      }
      .lin {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .lin b {
        font-family: "Bricolage", sans-serif;
        font-stretch: 75%;
        font-size: 52px;
        font-weight: 700;
      }
      .lin span {
        font-size: 28px;
        color: var(--signal);
      }
      .lid {
        font-size: 32px;
        line-height: 1.35;
        color: var(--muted);
        max-width: 900px;
      }
      /* identity and close */
      .kicker {
        font-size: 64px;
        font-weight: 500;
        color: var(--muted);
      }
      .arch {
        font-size: 150px;
        font-weight: 800;
        line-height: 0.92;
        color: var(--signal);
        max-width: 920px;
      }
      .handle {
        font-size: 150px;
        font-weight: 800;
        line-height: 0.95;
      }
      .cta {
        margin-top: 60px;
        font-size: 30px;
        color: var(--ink);
        padding: 22px 28px;
        border: 2px solid var(--signal);
        border-radius: 8px;
        align-self: flex-start;
        white-space: nowrap;
      }
      .cta span {
        display: block;
        color: var(--signal);
        margin-bottom: 8px;
      }
      /* footer rail: handle and year, nothing numbered */
      #rail {
        position: absolute;
        left: 84px;
        right: 84px;
        bottom: 64px;
        height: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      #rail .meta {
        display: flex;
        justify-content: space-between;
        font-size: 28px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      #rail .meta b {
        color: var(--ink);
        font-weight: 600;
      }
      /* thumbnail: the close as a still, no label, no rail, centred in the full frame */
      .thumb .inner {
        inset: 0;
        padding: 0 84px;
        justify-content: center;
      }
      .thumb .stack {
        flex: none;
      }
      /* thumbnail from the identity beat: kicker at the top, the name and its stats centred */
      .thumb .inner.tid {
        padding: 96px 84px;
        justify-content: flex-start;
      }
      .tid .sp {
        flex: 1;
      }
      .tid .tk {
        font-size: 30px;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .tid .tt {
        font-family: "Bricolage", sans-serif;
        font-weight: 800;
        font-stretch: 75%;
        line-height: 0.86;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .tid .ts {
        margin-top: 56px;
        font-size: 36px;
        line-height: 1.4;
        letter-spacing: 0.02em;
        color: var(--ink);
      }
      /* v6 charts: the shape of each question */
      .wrow { display: flex; align-items: center; gap: 60px; margin-top: 44px; }
      .waffle { display: grid; grid-template-columns: repeat(10, 44px); gap: 7px; }
      .w { display: block; aspect-ratio: 1; border-radius: 4px; }
      .w.o { background: #3a3530; }
      .legend { display: flex; flex-direction: column; gap: 22px; min-width: 330px; }
      .lg { display: flex; align-items: center; gap: 16px; font-size: 34px; white-space: nowrap; }
      .lg i { width: 30px; height: 30px; border-radius: 5px; flex: none; }
      .lg.rest i { box-shadow: inset 0 0 0 3px #6b6157; }
      .lg b { color: var(--ink); font-weight: 600; }
      .lg.rest b { color: var(--muted); font-weight: 500; }
      .lg em { margin-left: auto; padding-left: 24px; font-style: normal; color: var(--ink); font-weight: 700; }
      .lg.rest em { color: var(--muted); }
      .runline { margin-top: 70px; width: 912px; }
      .yline { display: flex; align-items: flex-end; height: 130px; }
      .yline .t { flex: 1; display: block; transform-origin: 50% 100%; }
      .yline .t.z { height: 12px; background: var(--rule); }
      .yline .t.f { height: 12px; background: var(--rule); opacity: 0.4; }
      .yline .t.a { height: 54px; background: #5a5047; }
      .yline .t.r { height: 130px; background: var(--signal); }
      .ymonths { display: flex; margin-top: 14px; font-size: 28px; color: var(--muted); }
      .ymonths span { flex: 1; }
      .ykey { display: flex; gap: 40px; margin-top: 22px; font-size: 28px; color: var(--muted); }
      .ykey i { display: inline-block; width: 22px; height: 22px; border-radius: 3px; margin-right: 12px; vertical-align: -3px; }
      .ykey .kr { background: var(--signal); }
      .ykey .ka { background: #5a5047; }
      .rugs { margin-top: 40px; width: 912px; }
      .nw { white-space: nowrap; }
      .sub, .dl { text-wrap: balance; }
      .hb .bar { position: relative; }
      .hb.peak .bar span { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 10px; font-size: 28px; color: var(--signal); font-weight: 700; white-space: nowrap; }
      .rate { margin-top: 48px; width: 912px; }
      .rtrack { height: 64px; background: var(--rule); border-radius: 6px; overflow: hidden; }
      .rbar { display: block; height: 100%; background: var(--signal); transform-origin: 0 50%; }
      .rlab { display: flex; justify-content: space-between; margin-top: 16px; font-size: 32px; color: var(--muted); }
      .rlab b { color: var(--ink); }
      .rate + .hunk { margin-top: 34px; }
      .rcols { display: flex; align-items: stretch; border-bottom: 0; }
      .rc { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
      .rs { display: grid; direction: rtl; align-content: end; grid-auto-flow: row; transform: scaleY(-1); }
      .rs .w { transform: scaleY(-1); }
      .rc span { margin-top: 12px; padding-top: 10px; width: 100%; text-align: center; font-size: 28px; color: var(--muted); border-top: 2px solid var(--rule); }
      .rkeys { margin-top: 30px; gap: 16px; }
      .rkeys .lg em { margin-left: 0; color: var(--muted); font-weight: 500; }
      /* v7: lines added against removed and a famous codebase, on one scale */
      .lines .dnum { gap: 40px; }
      .lines .unit { font-size: 60px; }
      .lbars { margin-top: 44px; width: 912px; display: flex; flex-direction: column; gap: 22px; }
      .ll { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font-size: 32px; }
      .ll b { font-weight: 600; color: var(--ink); }
      .ll span { color: var(--ink); font-weight: 700; }
      .lrow.ref .ll b, .lrow.ref .ll span { color: var(--muted); font-weight: 500; }
      .ltrack { height: 40px; }
      .ltrack .rbar { border-radius: 4px; }
      .lrow.ref .rbar { background: repeating-linear-gradient(135deg, #8f7b6c 0 8px, #5a5047 8px 16px) !important; }
      /* v7: machine time by month */
      .mbars { display: flex; gap: 12px; height: 380px; margin-top: 60px; width: 912px; }
      .mc { flex: 1; display: flex; flex-direction: column; }
      .mt { flex: 1; display: flex; align-items: flex-end; border-bottom: 2px solid var(--rule); }
      .cbar { display: block; width: 100%; position: relative; background: #5a5047; border-radius: 4px 4px 0 0; transform-origin: 50% 100%; }
      .mc.peak .cbar { background: var(--signal); }
      .cbar span { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 10px; font-size: 28px; color: var(--signal); font-weight: 700; white-space: nowrap; }
      .mc em { font-style: normal; text-align: center; margin-top: 12px; font-size: 28px; color: var(--muted); }
      /* catalogue beats: year on year and the biggest day (labelled columns), the punchcard,
         languages by repo, the model timeline */
      .mc:not(.peak) .cbar span { color: var(--ink); font-weight: 500; }
      .yb, .db { height: 360px; margin-top: 70px; }
      .yb { gap: 48px; }
      .yb .mt { justify-content: center; }
      .yb .cbar { width: 62%; }
      .yb em, .db em { font-size: 30px; }
      .mc.peak em { color: var(--signal); font-weight: 700; }
      .punch .unit, .langs .unit, .yoy .unit, .day .unit { font-size: 60px; }
      .punchc { margin-top: 50px; width: 912px; }
      .pr { display: flex; align-items: center; height: 54px; }
      .pr b { width: 84px; flex: none; font-size: 28px; font-weight: 500; color: var(--muted); }
      .pr b.on { color: var(--signal); font-weight: 700; }
      .pc { flex: 1; display: flex; align-items: center; justify-content: center; height: 100%; }
      .pc .pd { border-radius: 50%; aspect-ratio: auto; }
      .pc .pz { display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--rule); }
      .pticks { position: relative; height: 40px; margin: 10px 0 0 84px; border-top: 2px solid var(--rule); font-size: 28px; color: var(--muted); }
      .pticks span { position: absolute; top: 8px; }
      .lstack { margin-top: 56px; width: 912px; }
      .lsbar { display: flex; height: 72px; border-radius: 6px; overflow: hidden; }
      .lsbar .rbar { flex: none; height: 100%; box-shadow: inset -4px 0 0 var(--ground); }
      .lkeys { margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px 60px; }
      .lkeys .lg em { color: var(--ink); }
      .lkeys .lg.rest i { box-shadow: none; }
      .mhead { display: flex; align-items: flex-end; gap: 40px; }
      .mhead .unit { font-size: 60px; padding-bottom: 14px; max-width: 600px; }
      .mtl { margin-top: 56px; width: 912px; }
      .mline { position: relative; height: 64px; border-bottom: 3px solid #5a5047; margin-bottom: 4px; }
      .md { position: absolute; bottom: -14px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px var(--ground); }
      .md.on { background: var(--signal); }
      .mlist { margin-top: 34px; display: flex; flex-direction: column; gap: 6px; }
      .mi { display: flex; align-items: baseline; gap: 36px; height: 62px; }
      .mi span { width: 150px; flex: none; font-size: 32px; color: var(--muted); }
      .mi b { font-family: "Bricolage", sans-serif; font-stretch: 75%; font-size: 52px; font-weight: 700; color: var(--ink); }
      .mi.on span, .mi.on b { color: var(--signal); }
    </style>
  </head>
  <body>
    <div id="root" class="__ROOT_CLASS__" data-composition-id="main" data-start="0" data-width="1080" data-height="1350" data-duration="__DURATION__">
    <!--__SCENES__-->
      <!--rail-->
      <div id="rail" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="2">
        <div class="meta"><b>__HANDLE__</b><span>__YEAR__</span></div>
      </div>
      <!--/rail-->
    <!--__AUDIO__-->
    </div>
    <script>
      // Timing comes from build.py (beat_timing): per scene, the command types, then the hero
      // lands (t1), then the supporting group (t2), then everything holds still until the cut.
      const TIMING = /*__TIMING__*/[];
      const TOTAL = Number(document.getElementById("root").dataset.duration);
      const tl = gsap.timeline({ paused: true });
      const PACE = /*__PACE__*/{ speed: 1, fadeIn: 0.3, fadeOut: 0.35 };
      const d = (x) => x * PACE.speed;
      const fmt = (v) => Math.round(v).toLocaleString("en-US");

      TIMING.forEach((s, si) => {
        const scene = document.getElementById("s-" + s.key);
        const inner = scene.querySelector(".inner");
        const at = (x) => s.start + x;
        const end = s.start + s.duration;
        if (si > 0 && PACE.fadeIn > 0) tl.fromTo(inner, { opacity: 0 }, { opacity: 1, duration: PACE.fadeIn, ease: "power1.out" }, s.start);

          if (bars.length) tl.fromTo(bars, { scaleX: 0 }, { scaleX: 1, duration: d(0.7), ease: "power3.out", stagger: d(0.12) }, at(s.t2 + k * 0.15));
