# The no-login collector reads two GitHub profile pages that have no API contract. This fails when
# GitHub changes them, or when anonymous access to anything the film needs goes away.
name: public-smoke
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - skills/github-year-in-review/scripts/collect*.py
      - .github/workflows/public-smoke.yml
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect a busy public account with no token and no gh
        run: |
          env -u GH_TOKEN -u GITHUB_TOKEN PATH="$(dirname "$(which python)"):/usr/bin:/bin" \
            python skills/github-year-in-review/scripts/collect.py --public --user torvalds --out /tmp/year.json
      - name: The pages parsed and the numbers are sane
        run: |
          jq '.source, .totals, .rhythm.commits_sampled, .repo_count' /tmp/year.json
          jq -e '.source.mode == "public"
            and .totals.contributions > 0
            and .totals.contributions == .totals.calendar_sum
            and (.calendar | length) > 0
            and .repo_count > 0
            and .rhythm.commits_sampled >= 40
            and (.history | length) == 2
            and (.source.skipped | map(select(startswith("activity list"))) | length) == 0' /tmp/year.json
      - name: It builds a story
        run: python skills/github-year-in-review/scripts/build.py /tmp/year.json --out /tmp/film
